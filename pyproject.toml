[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-recover"
version = "1.1.11"
description = "Declarative workspace backup and recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["command-execution==2.0.6"]

[project.scripts]
workspace-recover = "workspace_recover.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["workspace_recover*"]

[tool.setuptools.package-data]
workspace_recover = ["resources/commands/*"]
