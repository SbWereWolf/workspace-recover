[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-recover"
version = "1.0.1"
description = "Declarative workspace backup and recovery"
requires-python = ">=3.11"
dependencies = ["command-execution==1.1.0"]

[project.scripts]
workspace-recover = "workspace_recover.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["workspace_recover*"]
